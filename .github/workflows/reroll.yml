name: D-AUTO Reroll Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: reroll-engine-${{ github.repository }}
  cancel-in-progress: true

jobs:
  reroll:
    name: "Reroll Engine (${{ contains(github.repository, 'dungby4') && 'D4' || 'H0' }})"
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: |
          pip install websockets==15.0.1
          npm ci --no-audit --no-fund
          python3 -m venv python_v79/.venv
          python_v79/.venv/bin/pip install websockets==15.0.1
          npx playwright install --with-deps chromium

      - name: 🚀 Run Reroll Engine
        env:
          MACHINE_NAME: ${{ contains(github.repository, 'dungby4') && 'D4' || 'H0' }}
          ACCOUNTS_PATH: accounts.json
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8711883902:AAGeVLrl9QI_BnZIzuLF9lD7kq8ryOTllrY' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '7182418544' }}
          SALES_BOT_WEBHOOK_URL: 'https://152-69-209-107.sslip.io/api/v1/inventory/hactaydu-webhook'
          SALES_BOT_SECRET: 'd57be08c4bbbc9c7feda86285611ee41fc8016d4f1bf4a1a7a60502d123b0ab3'
        run: |
          echo "=========================================================="
          echo "🤖 Starting D-AUTO on Machine: $MACHINE_NAME"
          echo "📁 Using Accounts File: $ACCOUNTS_PATH"
          echo "=========================================================="
          rm -f state/*.lock state/*/*.lock state/*/*/*.lock 2>/dev/null || true
          timeout 19200 node scripts/run-v79-latest.js || true

      - name: 💾 Save State and Winners to GitHub
        if: always()
        run: |
          git config user.name "D-AUTO Bot"
          git config user.email "bot@dauto.local"
          git add -f state/ processed_accounts.json jackpot_locked_vault.json accounts.json DAN_NICK_TRUNG_TUONG.* DANH_SACH_NICK_D_AUTO.* jackpot_screenshots/ || true
          git diff --staged --quiet || (git commit -m "chore: save state and winners [skip ci]" && git pull -s ort -X ours --no-edit origin main && git push origin HEAD:main)

  chain-next:
    name: "Auto-Chain Next Cycle"
    needs: [reroll]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Trigger next dispatch
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/reroll.yml/dispatches \
            -d '{"ref":"main"}' || true
