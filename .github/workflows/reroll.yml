name: D-AUTO PRO MAX v7.9 (Reroll 24/7)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

concurrency:
  group: reroll-python-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reroll:
    name: "Reroll Engine (Machine ${{ contains(github.repository, 'dungby4') && 'D4' || 'H0' }})"
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Python & Node.js Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: 🚀 Run High-Speed Reroll Engine
        env:
          MACHINE_NAME: ${{ contains(github.repository, 'dungby4') && 'D4' || 'H0' }}
          ACCOUNTS_PATH: ${{ contains(github.repository, 'dungby4') && 'accounts_d4.json' || 'accounts_h0.json' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8711883902:AAGeVLrl9QI_BnZIzuLF9lD7kq8ryOTllrY' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '7182418544' }}
        run: |
          echo "=========================================================="
          echo "🤖 Starting D-AUTO on Machine: $MACHINE_NAME"
          echo "📁 Using Accounts File: $ACCOUNTS_PATH"
          echo "=========================================================="
          # Run reroll with max duration of 5 hours 20 mins (19200 seconds)
          timeout 19200 python3 chay_web_auto.py --machine "$MACHINE_NAME" --accounts "$ACCOUNTS_PATH" --threads 16 --no-fresh || true

      - name: 💾 Save Jackpots & Vault to GitHub
        if: always()
        run: |
          git config user.name "D-AUTO Cloud Bot"
          git config user.email "bot@dauto.local"
          git add jackpot_locked_vault.json DAN_NICK_TRUNG_TUONG.* DANH_SACH_NICK_D_AUTO.* anh_nick_trung/ || true
          git diff --staged --quiet || (git commit -m "chore(vault): auto-save winning jackpots and evidence [skip ci]" && git pull --rebase origin main && git push origin HEAD:main)

  chain-next:
    name: "Auto-Chain Next Cycle"
    needs: [reroll]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Trigger next dispatch
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/reroll.yml/dispatches \
            -d '{"ref":"main"}' || true
